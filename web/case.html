<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>案例 · PsychoPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="press.css">
  <!-- page transitions: the first frame waits for #pp-end, after every script, so the move shows a finished page -->
  <link rel="expect" href="#pp-end" blocking="render">
  <script src="transit.js"></script>
</head>
<body>
  <!-- Case study page (case.html?id=cN). Same reader as the lessons: lesson.js loads cases/cN.html
       into #lesson; cases not yet written keep the hidden "in preparation" note. -->
  <div class="wrap">
    <header class="mast">
      <a class="back" id="back" href="index.html#cases"><span class="num" aria-hidden="true">←</span><span id="back-t">职场案例</span></a>
      <a class="logo" href="index.html"><i aria-hidden="true"></i>PsychoPilot</a>
    </header>

    <article class="l-wait">
      <div class="l-hero">
        <div>
          <div class="crumb lab" id="crumb"></div>
          <h1 id="title">案例</h1>
          <p class="lede" id="sub"></p>
        </div>
        <div class="stamp" aria-label="状态：制作中">制作中<small>In preparation</small></div>
      </div>
      <div class="l-note">
        <p>这个案例还在写。写完时，它会是一部完整的小说，后面附有科学解析和参考文献。</p>
      </div>
      <div id="lesson"></div>
    </article>

    <nav class="pager" aria-label="上一个与下一个案例">
      <a id="prev" hidden><span class="lab">← Previous</span><span class="t"></span></a>
      <a class="next" id="next" hidden><span class="lab">Next →</span><span class="t"></span></a>
    </nav>

    <footer class="foot">
      <span class="logo" style="font-size:16px"><i aria-hidden="true"></i>PsychoPilot</span>
      <p>案例中的人物、机构和情节均为虚构；书后的科学解析会说明哪些内容来自真实研究。PsychoPilot 是学习平台，不做心理诊断，也不提供治疗。如果你正处在困境中，请联系当地的专业心理健康服务。</p>
    </footer>
  </div>

  <script src="cases.js"></script>
  <script>
    (() => {
      const { cases, byId, caseUrl } = window.PPCases;
      const c = byId(new URLSearchParams(location.search).get('id')) || cases[0];
      const $ = (s) => document.querySelector(s);
      document.title = `${c.title} · 职场案例 · PsychoPilot`;
      const crumb = $('#crumb');
      [[`Case ${c.no}`], ['职场案例', 'index.html#cases'], [c.genre], [`${c.index + 1} / ${cases.length}`]]
        .forEach(([t, href]) => { const el = document.createElement(href ? 'a' : 'span'); if (href) el.href = href; el.textContent = t; crumb.appendChild(el); });
      $('#title').textContent = c.title;
      $('#sub').textContent = c.sub || c.genre;
      [['#prev', cases[c.index - 1]], ['#next', cases[c.index + 1]]].forEach(([sel, n]) => {
        if (!n) return;
        const a = $(sel);
        a.hidden = false;
        a.href = caseUrl(n);
        a.querySelector('.t').textContent = `${n.no} ${n.title}`;
      });
    })();
  </script>
  <script src="lab.js"></script>
  <script src="figs.js"></script>
  <script src="lesson.js"></script>
  <script src="top.js"></script>
  <script src="nav.js"></script>
  <i id="pp-end" hidden></i>
</body>
</html>
